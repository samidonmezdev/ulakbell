server {
    listen 80;
    listen [::]:80;
    server_name ivgjhhuximonypkh.tzty.net;

    return 301 https://$host$request_uri;
}
server {
    listen 8090 ssl;
    server_name ivgjhhuximonypkh.tzty.net;

    # SSL ayarlar (Certbot)
    ssl_certificate /etc/letsencrypt/live/ivgjhhuximonypkh.tzty.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivgjhhuximonypkh.tzty.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ivgjhhuximonypkh.tzty.net;

    root /var/www/ulakbell/public;  # Laravel projenin public klasörü

    index index.php index.html index.htm;

    # SSL ayarları (Certbot)
    ssl_certificate /etc/letsencrypt/live/ivgjhhuximonypkh.tzty.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivgjhhuximonypkh.tzty.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Laravel için URL yönlendirme
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM işlemleri
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # PHP sürümüne göre değiştir
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Gizli dosyalara erişimi engelle
    location ~ /\.ht {
        deny all;
    }

    # Cache veya log dosyalarını engellemek istersen:
    location ~* /(storage|vendor)/ {
        deny all;
    }
}
